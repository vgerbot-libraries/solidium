[package]
name = "rust-base64"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
defauult = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.92"
base64 = "0.22.1"

console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
opt-level = "s"
